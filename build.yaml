# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-dockerfile
build_from:
  aarch64: "ghcr.io/home-assistant/aarch64-base:3.21"
  amd64: "ghcr.io/home-assistant/amd64-base:3.21"
  armv7: "ghcr.io/home-assistant/armv7-base:3.21"
labels:
  org.opencontainers.image.title: "Home Assistant Add-on: M-Bus Reader"
  org.opencontainers.image.description: >-
    Read M-Bus sensors via USB serial adapter and publish to Home Assistant
    via MQTT auto-discovery.
  org.opencontainers.image.source: "https://github.com/NerdyProjects/ha-usb-mbus"
  org.opencontainers.image.licenses: "GPL-3.0"
